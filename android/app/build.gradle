def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
def releaseStoreFile = null
def releaseStorePassword = null
def releaseKeyAlias = null
def releaseKeyPassword = null

if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    releaseStoreFile = keystoreProperties.getProperty('storeFile')
    releaseStorePassword = keystoreProperties.getProperty('storePassword')
    releaseKeyAlias = keystoreProperties.getProperty('keyAlias')
    releaseKeyPassword = keystoreProperties.getProperty('keyPassword')
}

def hasCompleteReleaseSigning = hasReleaseSigning && releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

apply plugin: 'com.android.application'

android {
    namespace = "com.karovia.kmap"
    compileSdk = rootProject.ext.compileSdkVersion

    // 签名配置
    signingConfigs {
        release {
            storeFile file("../kmap-release.keystore")
            storePassword "kmap2026"
            keyAlias "kmap"
            keyPassword "kmap2026"
        }
    }

    defaultConfig {
        applicationId "com.karovia.kmap"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters = rootProject.ext.abiFilters
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            noCompress 'onnx', 'model', 'bin' // Don't compress model files for faster loading
        }
        // Copy model files from assets to app data on first run
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    signingConfigs {
        release {
            if (hasCompleteReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true // Enable code obfuscation
            shrinkResources true // Enable resource shrinking
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    // Configure APK splits to reduce size
    // splits {
    //     abi {
    //         enable true
    //         reset()
    //         include 'armeabi-v7a', 'arm64-v8a'
    //         universalApk false // Don't generate universal APK
    //     }
    // }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        // Enable ZIP64 for large APK files (>4GB)
        dex {
            useLegacyPackaging = false
        }
    }

    // Compress assets
    aaptOptions {
        cruncherEnabled = true
        cruncherProcesses = 4
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ONNX Runtime Mobile for local inference (内置NNAPI硬件加速支持)
    implementation "com.microsoft.onnxruntime:onnxruntime-android:$rootProject.ext.onnxRuntimeVersion"

    // AndroidX WorkManager for background tasks
    implementation "androidx.work:work-runtime:2.9.0"
    // Material Design components
    implementation "com.google.android.material:material:1.11.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
