version: '3.8'

services:
  # FastAPI 后端服务
  backend:
    build: .
    container_name: kmap-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://kmap:kmap123@postgres:5432/kmap
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEBULA_GRAPH_HOST=nebula-graphd
      - NEBULA_GRAPH_PORT=9669
      - RABBITMQ_URL=amqp://kmap:kmap123@rabbitmq:5672//
    depends_on:
      - postgres
      - redis
      - qdrant
      - nebula-graphd
      - rabbitmq
    networks:
      - kmap-network

  # PostgreSQL 16 数据库
  postgres:
    image: postgres:16-alpine
    container_name: kmap-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=kmap
      - POSTGRES_USER=kmap
      - POSTGRES_PASSWORD=kmap123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmap -d kmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kmap-network

  # Redis 7 缓存
  redis:
    image: redis:7-alpine
    container_name: kmap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kmap-network

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kmap-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=qdrant123
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kmap-network

  # Nebula Graph Metad 服务
  nebula-metad:
    image: vesoft/nebula-metad:v3.6.0
    container_name: kmap-nebula-metad
    restart: unless-stopped
    ports:
      - "9559:9559"
    volumes:
      - nebula_meta_data:/data/meta
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=0.0.0.0
      - --port=9559
      - --data_path=/data/meta
      - --v=0
      - --minloglevel=0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19559/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kmap-network

  # Nebula Graph Storaged 服务
  nebula-storaged:
    image: vesoft/nebula-storaged:v3.6.0
    container_name: kmap-nebula-storaged
    restart: unless-stopped
    ports:
      - "9779:9779"
    volumes:
      - nebula_storage_data:/data/storage
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=0.0.0.0
      - --port=9779
      - --data_path=/data/storage
      - --v=0
      - --minloglevel=0
    depends_on:
      - nebula-metad
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19779/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kmap-network

  # Nebula Graph Graphd 服务
  nebula-graphd:
    image: vesoft/nebula-graphd:v3.6.0
    container_name: kmap-nebula-graphd
    restart: unless-stopped
    ports:
      - "9669:9669"
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=0.0.0.0
      - --port=9669
      - --v=0
      - --minloglevel=0
      - --enable_authorize=false
    depends_on:
      - nebula-metad
      - nebula-storaged
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19669/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kmap-network

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: kmap-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=kmap
      - RABBITMQ_DEFAULT_PASS=kmap123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kmap-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  nebula_meta_data:
  nebula_storage_data:
  rabbitmq_data:

networks:
  kmap-network:
    driver: bridge
